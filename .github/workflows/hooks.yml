name: Hooks

# Card #64. The production database guard is what lets the release agent run
# without asking, so its tests must stay green.
on:
  pull_request:
    paths:
      - '.claude/hooks/**'
      - '.claude/settings.json'
      - 'supabase/migrations/**'
      - '.github/workflows/hooks.yml'
  push:
    branches: [develop, main]
    paths:
      - '.claude/hooks/**'
      - '.claude/settings.json'

permissions:
  contents: read

jobs:
  guard-tests:
    name: Production database guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings file is valid JSON and registers the guard
        run: |
          python3 -c "import json; d=json.load(open('.claude/settings.json')); s=json.dumps(d); assert 'guard-production-db.py' in s, 'guard hook is not registered'; print('settings ok')"
      - name: Run the guard tests
        run: python3 .claude/hooks/test_guard_production_db.py
